{% load static %}
<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — FinancialAudit</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'finance/favicon.svg' %}">

  {# Apply the saved theme before paint so the page doesn't flash the wrong colours #}
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("fa-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (stored === null && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) { /* localStorage may be unavailable; ignore */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'finance/tailwind.css' %}">
</head>
<body class="font-sans antialiased min-h-screen grid place-items-center p-4">

  <div class="w-full max-w-sm">

    <div class="flex items-center gap-2 mb-6 justify-center text-zinc-900 dark:text-zinc-100">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
          <rect x="5"  y="14" width="3" height="6"  rx="1"/>
          <rect x="10" y="9"  width="3" height="11" rx="1"/>
          <rect x="15" y="4"  width="3" height="16" rx="1"/>
        </svg>
      </span>
      <span class="font-semibold tracking-tight text-base">FinancialAudit</span>
    </div>

    <div class="tile">
      <h1 class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">Sign in</h1>
      <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1 mb-5">Welcome back. Sign in to your dashboard.</p>

      {% if form.errors %}
        <div class="mb-4 px-3 py-2 rounded-md bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-sm text-rose-700 dark:text-rose-300">
          Invalid username or password.
        </div>
      {% endif %}

      <form method="post" class="grid gap-3">
        {% csrf_token %}
        <label class="filter-field">Username
          <input name="username" type="text" autocomplete="username" autofocus required>
        </label>
        <label class="filter-field">Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn-primary mt-2 w-full">Sign in</button>
      </form>
    </div>

  </div>

</body>
</html>
